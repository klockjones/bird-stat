name: Supabase Keepalive

on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        env:
          SUPABASE_URL: https://sodfujxpthupbkmkibzm.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_4Kf1rQjqkQPI4y1zAzAXiw_ptqI8MMw
        run: |
          curl -sf -o /dev/null -w "status: %{http_code}\n" \
            "$SUPABASE_URL/rest/v1/" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
