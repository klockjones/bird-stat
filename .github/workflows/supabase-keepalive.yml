name: Supabase Keepalive

on:
  schedule:
    # 매일 오전 9시 17분 (KST) = UTC 00:17 실행
    - cron: "17 0 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        env:
          SUPABASE_URL: https://sodfujxpthupbkmkibzm.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_4Kf1rQjqkQPI4y1zAzAXiw_ptqI8MMw
        run: |
          echo "▶ Supabase REST 핑 시작: $(date -u)"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 20 \
            "$SUPABASE_URL/rest/v1/" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Supabase 응답 실패 (status: $HTTP_CODE)"
            exit 1
          fi
          echo "✅ Supabase 정상"

      - name: Ping Vercel deployment
        run: |
          echo "▶ Vercel 핑 시작"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 20 \
            "https://bird-stat.vercel.app/")
          echo "Vercel HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "307" ] && [ "$HTTP_CODE" != "302" ]; then
            echo "❌ Vercel 응답 실패 (status: $HTTP_CODE)"
            exit 1
          fi
          echo "✅ Vercel 정상"
